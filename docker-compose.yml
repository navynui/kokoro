services:
  tts:
    build: .
    container_name: kokoro-tts
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      # Unload GPU models from VRAM after this many minutes of no activity (0 = disabled)
      - IDLE_UNLOAD_MINUTES=10
      # Thai duration stretch for F5/JaiTTS (fixes rushed speech at speed 1.0)
      - F5_DURATION_SCALE=1.8
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./output:/app/output
      - ./piper_models:/app/piper_models
      - ./pythai_voices:/app/voices
      - ./f5_models:/app/f5_models
      - ./jaitts_models:/app/jaitts_models
      - ./ref_voices:/app/ref_voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Both GPUs exposed; P100 listed first so it maps to cuda:0.
              # server.py prefers it (fastest), then the GTX 1060, then CPU.
              device_ids:
                - GPU-37d0153e-32ad-2825-9300-de8903297fd1  # Tesla P100 (preferred)
                - GPU-ebd852dc-b885-2874-feb2-1b37c939588b  # GTX 1060
              capabilities: [gpu]
