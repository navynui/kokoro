services:
  tts:
    build: .
    container_name: kokoro-tts
    ports:
      - "8001:8000"
    restart: unless-stopped
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./output:/app/output
      - ./piper_models:/app/piper_models
      - ./pythai_voices:/app/voices
      - ./f5_models:/app/f5_models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Pin the GTX 1060 (host GPU index 1). Other GPUs on this host
              # (e.g. Tesla P100) stay untouched.
              device_ids:
                - GPU-ebd852dc-b885-2874-feb2-1b37c939588b
              capabilities: [gpu]
